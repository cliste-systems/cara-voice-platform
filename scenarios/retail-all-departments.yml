# Real worker rehearsals; a retrieval test alone cannot satisfy these assertions.
- name: fruit-vegetables-broad-0
  turns:
    - "Any offers in Fruit & Vegetables?"
  expect:
    clarification: true
    must_not_quote_prices: true
- name: fruit-vegetables-broad-1
  turns:
    - "Have ye got any deals in the Fruit & Vegetables section?"
  expect:
    clarification: true
    must_not_quote_prices: true
- name: fruit-vegetables-broad-2
  turns:
    - "What products are available in Fruit & Vegetables?"
  expect:
    clarification: true
    must_not_quote_prices: true
- name: fruit-vegetables-narrow-follow-up
  turns:
    - "Any offers in Fruit & Vegetables?"
    - "apples please"
  turn_expect:
    - clarification: true
      must_not_quote_prices: true
    - must_not_contain:
        - "Which department were you thinking of"
        - "that does not mean there are no offers"
